name: Build and Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build || true

      - name: Generate index.html
        run: |
          JS_FILE=$(ls .output/public/assets/index-*.js 2>/dev/null | head -1 | xargs basename)
          CSS_FILE=$(ls .output/public/assets/styles-*.css 2>/dev/null | head -1 | xargs basename)
          ROUTES_FILE=$(ls .output/public/assets/routes-*.js 2>/dev/null | head -1 | xargs basename)
          echo "JS: $JS_FILE | CSS: $CSS_FILE | ROUTES: $ROUTES_FILE"
          cat > .output/public/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <link rel="icon" href="/favicon.ico" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>My Sweet Spot</title>
              <link rel="stylesheet" crossorigin href="/assets/$CSS_FILE" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" crossorigin src="/assets/$ROUTES_FILE"></script>
              <script type="module" crossorigin src="/assets/$JS_FILE"></script>
            </body>
          </html>
          HTMLEOF
          echo "Generated index.html successfully"

      - name: Generate .htaccess for routing
        run: |
          cat > .output/public/.htaccess << EOF
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

      - name: List output files
        run: ls -la .output/public/

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.output/public/
          server-dir: /htdocs/
